name: Bug report
description: Report a bug in dbeaver-mcp
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        ## Do NOT paste secrets

        **Never include credentials, passwords, connection URLs/DSNs,
        `credentials-config.json`, or SQL dumps in this issue.**
        Redact hostnames, usernames, IP addresses, and database names before posting.

        For security vulnerabilities, do not open a public issue — see
        [SECURITY.md](https://github.com/apsolut/dbeaver-mcp/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The actual behaviour, including any error message (redacted).
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: Output of `npm run doctor`
      description: >-
        Run `npm run doctor` and paste the output here.
        Redact hostnames, IPs, usernames, and database names first.
      render: text
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node --version`.
      placeholder: v20.11.0
    validations:
      required: true

  - type: input
    id: dbeaver-version
    attributes:
      label: DBeaver version
      placeholder: 24.2.0 Community
    validations:
      required: true

  - type: dropdown
    id: ssh-tunnel
    attributes:
      label: Does the connection use an SSH tunnel?
      options:
        - "Yes"
        - "No"
    validations:
      required: true
